# Review reproducer for sibling retention (claude/local-thrash): with the exact
# strict-membership check in SiblingPool::take_inside replaced by the coarse
# isolating-interval filter, the solver reused a retained child outside its new
# sector and claimed completion with evidence that fails replay. The correct
# solver completes and the independent verifier accepts.
variables = ["x", "y", "z"]
constraints = ["x>0", "y>0", "z>0"]
split = [
  "-2*y^3+2*x^1-3*y^3+1*z^1",
  "3*x^1+1*x^1+3*z^1",
  "-1*x^2+2*z^1-2*x^2+1*z^2",
  "1*x^1*y^2-1*x^1*z^2+3*z^2",
]

[solver]
engine = "local"
ordering = "given"
order = ["x", "y", "z"]
local_stable_samples = true
local_retain_siblings = true

[limits]
wall_time_secs = 60.0
