[package]
name = "symgcad"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Exact generic cylindrical algebraic decomposition using Symbolica"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
blake3 = "1"
libc = "0.2"
rand = "0.9"
symbolica = { version = "3.0.1", default-features = false, features = ["integer-gmp", "float-mpfr", "tracing_max_level_info"] }

[features]
# Benchmark-only hooks for benchmark/FLINT_vs_symbolica (off by default; not
# production API): exact segmentation operands, the univariate integer
# resultant kernel, and SYMGCAD_CAPTURE_ALL operation harvesting.
flint-bench-hooks = []

# Symbolica side of the FLINT comparison (see benchmark/FLINT_vs_symbolica/README.md).
[[example]]
name = "flint_vs_symbolica"
path = "benchmark/FLINT_vs_symbolica/symbolica/flint_vs_symbolica.rs"
required-features = ["flint-bench-hooks"]

# Standalone pins. A consuming workspace supplies its own root patches, so
# symGCAD shares the consumer's Symbolica types instead of a private checkout.
[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", rev = "75f8350094b90254ee71dc2a391fde0d14b0204a" }

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

[profile.dev.package."*"]
opt-level = 2
