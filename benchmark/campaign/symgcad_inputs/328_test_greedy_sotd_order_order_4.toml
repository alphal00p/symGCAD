name = "test_greedy_sotd_order/order/4"
variables = [
    "x",
    "y",
]
constraints = [
    "(x + 3)^2 + (y + 1)^2 - 4 > 0",
    "(x - 3)^2 + (y - 1)^2 - 4 > 0",
]
split = []
variable_groups = [
    ["x"],
    ["y"],
]

[parameters]

[solver]
engine = "optimized"
ordering = "mods"
order = []
merge = "none"
seed = 0
max_rollouts = 256
search_pruning = true
cache_memory_mib = 128
positivity = true
input_positivity = true
homogeneous_block = []

[limits]
wall_time_secs = 60.0
memory_mib = 4096
workers = 1
