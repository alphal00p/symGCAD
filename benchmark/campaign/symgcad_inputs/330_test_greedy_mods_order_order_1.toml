name = "test_greedy_mods_order/order/1"
variables = [
    "x",
    "y",
    "z",
]
constraints = ["x^4*y^2*z + x*y*z + 1 > 0"]
split = []
variable_groups = [[
    "x",
    "y",
    "z",
]]

[parameters]

[solver]
engine = "optimized"
ordering = "mods"
order = []
merge = "none"
seed = 0
max_rollouts = 256
search_pruning = true
cache_memory_mib = 128
positivity = true
input_positivity = true
homogeneous_block = []

[limits]
wall_time_secs = 60.0
memory_mib = 4096
workers = 1
