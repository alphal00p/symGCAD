name = "finiteE_3_7__3_0__1_1_1_0/symbolic"
variables = [
    "s",
    "x0",
    "x1",
    "x2",
]
constraints = [
    "s > 4",
    "x0 > 0",
    "x1 > 0",
    "x2 > 0",
]
split = ["mt2*(x0+x1+x2)^2-(s)*x0*x2"]
variable_groups = [
    ["s"],
    [
    "x0",
    "x1",
    "x2",
],
]

[parameters]
mt2 = "1"
mz2 = "5/18"

[solver]
engine = "monotone"
ordering = "mods"
order = []
merge = "none"
seed = 0
max_rollouts = 256
search_pruning = true
cache_memory_mib = 128
positivity = true
input_positivity = true
homogeneous_block = [
    "x0",
    "x1",
    "x2",
]
homogeneous_anchor = "x0"

[limits]
wall_time_secs = 60.0
memory_mib = 4096
workers = 1
